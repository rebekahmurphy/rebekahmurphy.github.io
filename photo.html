    <button onclick="changeSlide(-1)" style="margin: 1rem 0.5rem; padding: 0.5rem 1rem; cursor: pointer;">← Previous</button>
    <span id="slideCounter" style="margin: 0 1rem;">1 / 40</span>
    <button onclick="changeSlide(1)" style="margin: 1rem 0.5rem; padding: 0.5rem 1rem; cursor: pointer;">Next →</button>
</div>

<script>
let currentSlide = 0;
const images = document.querySelectorAll('.carousel-img');
const total = images.length;

function changeSlide(direction) {
    images[currentSlide].style.display = 'none';
    currentSlide = (currentSlide + direction + total) % total;
    images[currentSlide].style.display = 'block';
    document.getElementById('slideCounter').textContent = (currentSlide + 1) + ' / ' + total;
}
</script>
